<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0d0d0d"/>
  <rect width="100" height="5.5" rx="2.5" fill="#E8002D"/>
  <!-- Baseline 63.62, not 72: it puts the ink box of GF1 (measured 73.63 x 28.25)
       dead centre on the canvas. The glyphs are caps only, so centring on the font's
       em box instead leaves the mark sitting visibly low. -->
  <g transform="translate(49.44,63.62) skewX(-9)">
    <text text-anchor="middle" y="0" dx="-24"
      font-family="'Arial Black',Impact,Arial,sans-serif"
      font-size="38" font-weight="900" fill="#ffffff">G</text>
    <text text-anchor="middle" y="0" dx="2"
      font-family="'Arial Black',Impact,Arial,sans-serif"
      font-size="38" font-weight="900" fill="#E8002D">F</text>
    <text text-anchor="middle" y="0" dx="27"
      font-family="'Arial Black',Impact,Arial,sans-serif"
      font-size="38" font-weight="900" fill="#ffffff">1</text>
  </g>
</svg>
