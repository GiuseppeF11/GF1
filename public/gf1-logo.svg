<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#15151e"/>

  <!-- Red racing stripe top -->
  <rect x="0" y="0" width="64" height="6" rx="10" fill="#e10600"/>
  <rect x="0" y="4" width="64" height="4" fill="#e10600"/>

  <!-- Checkered flag pattern (bottom-right corner accent) -->
  <rect x="44" y="44" width="6" height="6" fill="#ffffff" opacity="0.15"/>
  <rect x="50" y="44" width="6" height="6" fill="#ffffff" opacity="0.05"/>
  <rect x="44" y="50" width="6" height="6" fill="#ffffff" opacity="0.05"/>
  <rect x="50" y="50" width="6" height="6" fill="#ffffff" opacity="0.15"/>
  <rect x="56" y="44" width="8" height="6" rx="0" fill="#ffffff" opacity="0.15"/>
  <rect x="44" y="56" width="6" height="8" fill="#ffffff" opacity="0.15"/>
  <rect x="56" y="50" width="8" height="6" fill="#ffffff" opacity="0.05"/>
  <rect x="50" y="56" width="6" height="8" fill="#ffffff" opacity="0.05"/>
  <rect x="56" y="56" width="8" height="8" fill="#ffffff" opacity="0.15"/>

  <!-- "GF1" text -->
  <text x="8" y="48" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="-1">GF</text>
  <text x="46" y="48" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="30" fill="#e10600">1</text>
</svg>
